<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>球哥的足球账本</title>
  <link rel="stylesheet" href="style.css">
  <script src="data.js"></script>
</head>
<body id="top">
  <div class="deco d1" aria-hidden="true"></div>
  <div class="deco d2" aria-hidden="true"></div>
  <div class="deco d3" aria-hidden="true"></div>
  <div class="deco d4" aria-hidden="true"></div>
  <div class="deco d5" aria-hidden="true"></div>

  <header class="hero">
    <div class="hero-card">
      <span class="hero-kicker">FOOTBALL LEDGER / DISPLAY</span>
      <h1 class="hero-title" id="heroTitle">球哥的足球账本</h1>
      <p class="hero-sub" id="heroSub">为热爱买单，每一笔都值得记录</p>
      <div class="hero-meta">
        <span class="hero-chip">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><rect x="3" y="4" width="18" height="17"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          数据更新于 <b id="metaUpdated">-</b>
        </span>
        <span class="hero-chip">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/></svg>
          共 <b id="metaCount">0</b> 笔记录
        </span>
      </div>
    </div>
  </header>

  <nav class="navbar">
    <div class="nav-inner">
      <a class="brand" href="#top"><span class="brand-badge">球哥账本</span></a>
      <div class="nav-links">
        <a class="nav-link" href="#live">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M3 9V7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2"/><path d="M3 15v2a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-2"/><path d="M15 5v14"/></svg>
          现场看球
        </a>
        <a class="nav-link" href="#jersey">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M20.4 3.5 16 2a4 4 0 0 1-8 0L3.6 3.5a2 2 0 0 0-1.3 2.2l.6 3.5a1 1 0 0 0 1 .8H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.1a1 1 0 0 0 1-.8l.6-3.5a2 2 0 0 0-1.3-2.2Z"/></svg>
          球衣
        </a>
      </div>
    </div>
  </nav>

  <div class="page">
    <section class="stats" aria-label="统计概览">
      <div class="stats-grid" id="statsGrid"></div>
    </section>

    <main>
      <section id="live" class="category live">
        <div class="section-head">
          <span class="section-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M3 9V7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2"/><path d="M3 15v2a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-2"/><path d="M15 5v14"/></svg>
          </span>
          <h2 class="section-title">现场看球</h2>
          <div class="section-tools">
            <span class="chip" id="count-live">0 笔</span>
            <span class="chip accent" id="total-live">RMB 0</span>
          </div>
          <p class="section-desc">每一次奔赴球场的证明，票根、照片和回忆都在这里。</p>
        </div>
        <div id="liveList" class="timeline"></div>
      </section>

      <section id="jersey" class="category jersey">
        <div class="section-head">
          <span class="section-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M20.4 3.5 16 2a4 4 0 0 1-8 0L3.6 3.5a2 2 0 0 0-1.3 2.2l.6 3.5a1 1 0 0 0 1 .8H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.1a1 1 0 0 0 1-.8l.6-3.5a2 2 0 0 0-1.3-2.2Z"/></svg>
          </span>
          <h2 class="section-title">球衣</h2>
          <div class="section-tools">
            <span class="chip" id="count-jersey">0 笔</span>
            <span class="chip accent" id="total-jersey">RMB 0</span>
          </div>
          <p class="section-desc">衣柜里的主队精神，一件一件慢慢收藏。</p>
        </div>
        <div id="jerseyList"></div>
      </section>

    </main>
  </div>

  <footer>
    <span class="foot-brand">球哥的足球账本</span>
    <p class="foot-tag">为热爱买单，每一笔都值得记录</p>
    <span class="foot-version" id="metaVersion">DATA V1</span>
  </footer>

  <button type="button" class="to-top" id="toTop" title="回到顶部">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg>
  </button>

  <script src="app.js"></script>
</body>
</html>
