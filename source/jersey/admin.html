<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>球哥的足球账本 / 管理版</title>
  <link rel="stylesheet" href="style.css">
</head>
<body id="top">
  <div class="deco d1" aria-hidden="true"></div>
  <div class="deco d2" aria-hidden="true"></div>
  <div class="deco d3" aria-hidden="true"></div>
  <div class="deco d4" aria-hidden="true"></div>
  <div class="deco d5" aria-hidden="true"></div>

  <header class="hero">
    <div class="hero-card">
      <span class="hero-kicker">FOOTBALL LEDGER / ADMIN</span>
      <h1 class="hero-title" id="heroTitle">球哥的足球账本</h1>
      <p class="hero-sub" id="heroSub">为热爱买单，每一笔都值得记录</p>
      <div class="hero-meta">
        <span class="hero-chip">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><rect x="3" y="4" width="18" height="17"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          数据更新于 <b id="metaUpdated">-</b>
        </span>
        <span class="hero-chip">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/></svg>
          共 <b id="metaCount">0</b> 笔记录
        </span>
      </div>
    </div>
  </header>

  <nav class="navbar">
    <div class="nav-inner">
      <a class="brand" href="#top"><span class="brand-badge">球哥账本</span></a>
      <div class="nav-links">
        <a class="nav-link" href="#live">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M3 9V7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2"/><path d="M3 15v2a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-2"/><path d="M15 5v14"/></svg>
          现场看球
        </a>
        <a class="nav-link" href="#jersey">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M20.4 3.5 16 2a4 4 0 0 1-8 0L3.6 3.5a2 2 0 0 0-1.3 2.2l.6 3.5a1 1 0 0 0 1 .8H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.1a1 1 0 0 0 1-.8l.6-3.5a2 2 0 0 0-1.3-2.2Z"/></svg>
          球衣
        </a>
      </div>
    </div>
  </nav>

  <div class="page">
    <div class="admin-bar">
      <button type="button" class="btn yellow" id="saveDataBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/></svg>
        保存到 data.js
      </button>
      <button type="button" class="btn teal" id="exportJsonBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg>
        导出 JSON
      </button>
      <button type="button" class="btn mint" id="importJsonBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/></svg>
        导入 JSON
      </button>
      <button type="button" class="btn coral" id="resetSampleBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.7 9.7 0 0 0-6.7 2.7L3 8"/><path d="M3 3v5h5"/></svg>
        恢复示例
      </button>
      <span class="admin-hint">修改后记得保存到 data.js，展示版才会更新</span>
      <input type="file" id="importFile" accept="application/json" class="hidden">
    </div>
    <div class="unsaved-banner" id="unsavedBanner">当前有未保存到 data.js 的修改，记得点击「保存到 data.js」。</div>

    <section class="stats" aria-label="统计概览">
      <div class="stats-grid" id="statsGrid"></div>
    </section>

    <main>
      <section id="live" class="category live">
        <div class="section-head">
          <span class="section-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M3 9V7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2"/><path d="M3 15v2a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-2"/><path d="M15 5v14"/></svg>
          </span>
          <h2 class="section-title">现场看球</h2>
          <div class="section-tools">
            <span class="chip" id="count-live">0 笔</span>
            <span class="chip accent" id="total-live">RMB 0</span>
            <button type="button" class="add-btn" data-type="live">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
              添加
            </button>
          </div>
          <p class="section-desc">每一次奔赴球场的证明，票根、照片和回忆都在这里。</p>
        </div>
        <div id="liveList" class="timeline"></div>
      </section>

      <section id="jersey" class="category jersey">
        <div class="section-head">
          <span class="section-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M20.4 3.5 16 2a4 4 0 0 1-8 0L3.6 3.5a2 2 0 0 0-1.3 2.2l.6 3.5a1 1 0 0 0 1 .8H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.1a1 1 0 0 0 1-.8l.6-3.5a2 2 0 0 0-1.3-2.2Z"/></svg>
          </span>
          <h2 class="section-title">球衣</h2>
          <div class="section-tools">
            <span class="chip" id="count-jersey">0 笔</span>
            <span class="chip accent" id="total-jersey">RMB 0</span>
            <button type="button" class="add-btn" data-type="jersey">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
              添加
            </button>
          </div>
          <p class="section-desc">衣柜里的主队精神，一件一件慢慢收藏。</p>
        </div>
        <div id="jerseyList"></div>
      </section>

    </main>
  </div>

  <footer>
    <span class="foot-brand">球哥的足球账本</span>
    <p class="foot-tag">管理版仅供本地使用</p>
    <span class="foot-version" id="metaVersion">DATA V1</span>
  </footer>

  <div class="fab-menu hidden" id="fabMenu">
    <button type="button" class="fab-option" data-type="live">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M3 9V7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2"/><path d="M3 15v2a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-2"/><path d="M15 5v14"/></svg>
      现场看球
    </button>
    <button type="button" class="fab-option" data-type="jersey">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M20.4 3.5 16 2a4 4 0 0 1-8 0L3.6 3.5a2 2 0 0 0-1.3 2.2l.6 3.5a1 1 0 0 0 1 .8H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.1a1 1 0 0 0 1-.8l.6-3.5a2 2 0 0 0-1.3-2.2Z"/></svg>
      球衣
    </button>
  </div>
  <button type="button" class="fab" id="addFab" title="添加记录">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>
  <button type="button" class="to-top" id="toTop" title="回到顶部">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg>
  </button>

  <div id="modalOverlay" class="modal-overlay">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-header">
        <h3 id="modalTitle">添加记录</h3>
        <button type="button" class="icon-btn" id="modalClose" title="关闭">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <form id="recordForm">
        <div id="formFields" class="form-grid"></div>
        <div class="form-grid">
          <div class="field col-12">
            <label>图片</label>
            <div class="photo-input-row">
              <input type="text" id="photoPath" placeholder="图片路径，如 assets/jersey/01.jpg">
              <input type="file" id="photoFile" accept="image/*" class="file-input">
            </div>
            <div id="photoPreviewWrap">
              <img id="photoPreview" alt="图片预览" class="hidden">
              <button type="button" id="removePhotoBtn" class="link-btn hidden">移除图片</button>
            </div>
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn" id="modalCancel">取消</button>
          <button type="submit" class="btn yellow">保存</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    window.LEDGER_ADMIN = true;
  </script>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script src="admin.js"></script>
</body>
</html>
